<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Elton GmbH – Bestellliste (Vollversion)</title>
  <meta name="theme-color" content="#D9291F">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="mask-icon" href="/icons/icon.svg" color="#D9291F">
  <style>
    :root{--bg:#F4F1EC;--card:#fff;--accent:#D9291F;--muted:#666;--pill:#eee;--primary:#2E9AD1}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:#111}
    .wrap{max-width:900px;margin:18px auto;padding:16px}
    header{display:flex;align-items:center;justify-content:space-between}
    h1{margin:0;font-size:22px}
    .card{background:var(--card);padding:14px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
    .form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    input[type=text], input[type=number], select{padding:12px;border-radius:10px;border:1px solid #e6e4df;min-width:0}
    button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:12px;font-weight:600}
    .ghost{background:var(--pill);color:#111;padding:10px;border-radius:10px;border:0}
    ul{list-style:none;padding:0;margin:12px 0}
    li{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:10px;border:1px solid #f0efe9;margin-bottom:8px;background:#fff}
    .meta{color:var(--muted);font-size:13px}
    .controls{display:flex;gap:8px}
    .controls button{border:0;background:transparent;padding:8px;border-radius:10px;font-size:15px}
    .controls button:hover{background:#f3f3f3}
    .controls .done{background:#E9F8EE;color:#0C8A3A}
    .controls .edit{background:#FFF7E6;color:#C47D00}
    .controls .del{background:#FDECEA;color:#B80F0F}
    .small{font-size:13px;color:var(--muted)}
    footer{margin-top:14px;text-align:center;color:var(--muted);font-size:13px}
    .pill{background:#fff;padding:6px 10px;border-radius:999px;border:1px solid #eee}

    /* action buttons */
    .primary{background:var(--primary);color:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 6px 18px rgba(46,154,209,.12);text-decoration:none;display:inline-block}
    .danger{background:#D9291F;color:#fff;border-radius:14px;padding:12px 18px}

    /* modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
    .modal{background:#fff;padding:16px;border-radius:10px;max-width:720px;width:92%}
    .modal h2{margin:0 0 12px}
    .field{margin-bottom:8px}
    .field textarea{width:100%;min-height:100px;padding:10px;border-radius:8px;border:1px solid #eee}

    /* toast */
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#111;color:#fff;padding:10px 14px;border-radius:10px;display:none}

    /* responsive */
    @media (max-width:520px){ .form{flex-direction:column} .controls{gap:6px} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Elton GmbH – Bestellliste</h1>
      <div style="display:flex;gap:10px;align-items:center">
        <div id="syncStatus" class="pill small">Sync: lokal</div>
        <button id="openSettings" class="ghost" aria-label="Einstellungen">Einstellungen</button>
        <a id="exportBtn" class="primary" href="#" role="button">Export</a>
      </div>
    </header>

    <div class="card" id="app">
      <div>
        <div class="form" role="form" aria-label="Neuen Eintrag hinzufügen">
          <input id="name" type="text" placeholder="Artikelname (z. B. Schraube M6)" aria-label="Artikelname" />
          <input id="qty" type="number" placeholder="Menge" min="1" value="1" style="width:96px" aria-label="Menge" />
          <select id="unit" style="width:130px" aria-label="Einheit">
            <option>Stück</option>
            <option>Gebinde</option>
          </select>
          <select id="category" style="width:160px" aria-label="Kategorie">
            <option>Schrauben</option>
            <option>Werkzeug</option>
            <option>Kleber</option>
            <option>Verbrauchsmaterial</option>
            <option>Sonstiges</option>
          </select>
          <button id="add" class="primary">Hinzufügen</button>
        </div>
        <p class="small" style="margin-top:8px">Tipp: benutze Kurznamen und Mengen; Einträge werden lokal auf diesem Gerät gespeichert.</p>
      </div>

      <hr style="margin:12px 0;border:0;border-top:1px solid #f0efe9" />

      <div>
        <strong>Bestellliste</strong>
        <ul id="list" aria-live="polite"></ul>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button id="clearAll" class="ghost">Alle löschen</button>
          <button id="importBtn" class="ghost">Import</button>
          <button id="resetData" class="ghost">Reset lokal</button>
        </div>
      </div>
    </div>

    <footer>
      <p>Diese Vollversion ist vorgebaut und benötigt keine Transpilierung im Browser — stabiler auf iPhone Safari.</p>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // Utilities
    function $(id){ return document.getElementById(id); }
    function toast(msg, ms=2400){ const t=$('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', ms); }

    // Storage & Keys
    const STORAGE_KEY = 'elton_bestellliste_v1';
    const FIREBASE_KEY = 'elton_bestellliste_firebase';
    const ANTHROPIC_KEY = 'elton_bestellliste_anthropic';

    // Elements
    const nameEl = $('name'), qtyEl = $('qty'), unitEl = $('unit'), catEl = $('category');
    const addBtn = $('add'), listEl = $('list'), clearBtn = $('clearAll');
    const exportBtn = $('exportBtn'), importBtn = ('importBtn'), resetBtn = ('resetData');
    const modal = ('modal'), openSettings = ('openSettings'), closeModal = ('closeModal'), saveSettings = ('saveSettings');
    const firebaseConfigEl = ('firebaseConfig'), anthropicKeyEl = ('anthropicKey');
    const syncStatusEl = ('syncStatus');

    // Data helpers
    function load(){ try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ console.warn('load error', e); return []; } }
    function save(items){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }catch(e){ console.warn('save error', e); } }
    function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

    // Render
    function render(){ const items = load(); listEl.innerHTML=''; if(items.length===0){ const li=document.createElement('li'); li.textContent='Keine Einträge'; li.style.justifyContent='center'; listEl.appendChild(li); return; }
      items.forEach(it=>{ const li=document.createElement('li'); const left=document.createElement('div'); left.style.display='flex'; left.style.flexDirection='column'; const title=document.createElement('div'); title.textContent = it.name + ' — ' + it.qty + ' ' + it.unit; title.style.fontWeight='700'; const meta=document.createElement('div'); meta.textContent = it.category; meta.className='meta'; left.appendChild(title); left.appendChild(meta); li.appendChild(left);
        const controls=document.createElement('div'); controls.className='controls';
        const done=document.createElement('button'); done.textContent='✓'; done.title='Als bestellt markieren'; done.className='done'; done.onclick=()=>toggleDone(it.id);
        const edit=document.createElement('button'); edit.textContent='✎'; edit.title='Bearbeiten'; edit.className='edit'; edit.onclick=()=>editItem(it.id);
        const del=document.createElement('button'); del.textContent='🗑'; del.title='Löschen'; del.className='del'; del.onclick=()=>removeItem(it.id);
        controls.appendChild(done); controls.appendChild(edit); controls.appendChild(del); li.appendChild(controls);
        if(it.done) li.style.opacity='0.6'; listEl.appendChild(li);
      }); }

    // Actions
    function addItem(){ const name=nameEl.value.trim(); if(!name) return toast('Bitte Artikelname eingeben'); const qty=parseInt(qtyEl.value,10)||1; const unit=unitEl.value; const category=catEl.value; const items=load(); items.unshift({ id: uid(), name, qty, unit, category, done:false, created: Date.now() }); save(items); render(); nameEl.value=''; qtyEl.value='1'; nameEl.focus(); toast('Eintrag hinzugefügt'); }
    function removeItem(id){ if(!confirm('Eintrag löschen?')) return; let items=load(); items=items.filter(i=>i.id!==id); save(items); render(); toast('Eintrag gelöscht'); }
    function toggleDone(id){ const items=load(); const it=items.find(i=>i.id===id); if(!it) return; it.done=!it.done; save(items); render(); }
    function editItem(id){ const items=load(); const it=items.find(i=>i.id===id); if(!it) return; const newName=prompt('Bearbeite Artikelname', it.name); if(newName===null) return; it.name=newName.trim()||it.name; save(items); render(); toast('Eintrag aktualisiert'); }
    function clearAll(){ if(!confirm('Alle Einträge wirklich löschen?')) return; localStorage.removeItem(STORAGE_KEY); render(); toast('Alle Einträge gelöscht'); }

    // Export / Import
    function exportJson(){ const items=load(); const data=JSON.stringify(items); const blob=new Blob([data],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='bestellliste-export.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); toast('Export gestartet'); }
    function importJson(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const reader=new FileReader(); reader.onload=()=>{ try{ const parsed=JSON.parse(reader.result); if(!Array.isArray(parsed)) throw new Error('Ungültiges Format'); save(parsed); render(); toast('Import erfolgreich'); }catch(err){ alert('Import fehlgeschlagen: ' + (err.message||err)); } }; reader.readAsText(f); }; inp.click(); }

    // Settings modal
    openSettings.addEventListener('click', ()=>{ firebaseConfigEl.value = localStorage.getItem(FIREBASE_KEY) || ''; anthropicKeyEl.value = localStorage.getItem(ANTHROPIC_KEY) || ''; modal.style.display='flex'; });
    closeModal.addEventListener('click', ()=>{ modal.style.display='none'; });
    saveSettings.addEventListener('click', ()=>{ const f=firebaseConfigEl.value.trim(); if(f){ try{ JSON.parse(f); localStorage.setItem(FIREBASE_KEY,f); toast('Firebase-Konfiguration gespeichert'); }catch(e){ return alert('Ungültiges Firebase JSON'); } } else { localStorage.removeItem(FIREBASE_KEY); }
      const a=anthropicKeyEl.value.trim(); if(a){ localStorage.setItem(ANTHROPIC_KEY,a); toast('Anthropic Key gespeichert'); } else localStorage.removeItem(ANTHROPIC_KEY);
      updateSyncStatus(); modal.style.display='none';
    });

    // Reset local data
    resetBtn.addEventListener('click', ()=>{ if(!confirm('Lokal alle Site-Daten löschen? (inkl. Einstellungen)')) return; localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(FIREBASE_KEY); localStorage.removeItem(ANTHROPIC_KEY); render(); toast('Lokale Daten gelöscht'); updateSyncStatus(); });

    // Wire up simple buttons
    addBtn.addEventListener('click', addItem);
    clearBtn.addEventListener('click', clearAll);
    exportBtn.addEventListener('click', exportJson);
    importBtn.addEventListener('click', importJson);
    document.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && document.activeElement===nameEl) addItem(); });

    // Sync status indicator
    function updateSyncStatus(){ const fb = localStorage.getItem(FIREBASE_KEY); const an = localStorage.getItem(ANTHROPIC_KEY); if(fb && an) { syncStatusEl.textContent='Sync: Firebase + Anthropic (disabled until enabled)'; } else if(fb){ syncStatusEl.textContent='Sync: Firebase (disabled until enabled)'; } else { syncStatusEl.textContent='Sync: lokal'; } }

    // initial render
    render(); updateSyncStatus();

    // Try to unregister old service workers and clear caches once (best-effort)
    (async function tryCleanup(){
      try{
        if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
          const regs = await navigator.serviceWorker.getRegistrations();
          for(const r of regs) await r.unregister();
        }
      }catch(e){}
      try{ if(window.caches && caches.keys){ for(const k of await caches.keys()){ try{ await caches.delete(k); }catch(e){} } } }catch(e){}
    })();

    // show small hint if ServiceWorker was previously registered (for power users)
    (async function swHint(){ try{ if(navigator.serviceWorker && navigator.serviceWorker.controller){ toast('ServiceWorker aktiv – ggf. Seite neu laden nach Cleanup', 3500); } }catch(e){} })();

  </script>
</body>
</html>
